name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run complete unit and integration suite
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run cross-platform browser E2E
        run: node node_modules/@playwright/test/cli.js test --config=playwright.cross-platform.config.ts --reporter=line,github

      - name: Run Draft Store browser E2E
        run: npm run test:e2e:draft-store

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build . -t docus-ci-smoke

      - name: Start image and check health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --tmpfs /app/data:rw,mode=1777 --tmpfs /app/src/content:rw,mode=1777 -p 127.0.0.1:18080:3000 docus-ci-smoke)"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run dedicated authentication browser smoke
        run: npm run test:e2e:auth

      - name: Upload authentication browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-browser-evidence
          path: test-results
          if-no-files-found: ignore

  visual:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run macOS visual baselines
        run: node node_modules/@playwright/test/cli.js test e2e/markdown-visual.spec.ts --reporter=line,github
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-macos
          path: test-results
          if-no-files-found: ignore
